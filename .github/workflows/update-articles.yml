name: Update latest articles

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite the Latest Articles list from the synepho.com feed
        run: python3 .github/scripts/update_articles.py

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Articles already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest articles from synepho.com feed"
          git push
